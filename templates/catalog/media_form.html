{% extends 'base.html' %}
{% block title %}{{ title }} - MediaMerge{% endblock %}
{% block content %}
<div class="container" style="max-width: 800px; margin-top: 2rem;">
    <div class="card">
        <h2>{{ title }}</h2>
        <form method="post" enctype="multipart/form-data" style="margin-top: 2rem;">
            {% csrf_token %}
            {{ form.as_p }}
            <div style="margin-top: 2rem; display: flex; gap: 1rem;">
                <button type="submit" class="btn btn-primary">Save Media</button>
                <a href="{% url 'catalog:creator_dashboard' %}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
